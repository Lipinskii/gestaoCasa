<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos da Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gastos da Casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --txt: #16201e; --sub: #5d6b68; --borda: #e2e8e6;
    --pri: #0f766e; --pri-claro: #d9f2ee; --pos: #15803d; --neg: #c2410c; --perigo: #b91c1c;
    --raio: 14px; --sombra: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1413; --card: #18211f; --txt: #e8efed; --sub: #9aaba7; --borda: #2a3633;
      --pri: #2dd4bf; --pri-claro: #123632; --pos: #4ade80; --neg: #fb923c; --perigo: #f87171;
      --sombra: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .topo { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 18px 10px; display: flex; align-items: center; gap: 10px; }
  .topo h1 { font-size: 1.3rem; margin: 0; flex: 1; }
  .sync { font-size: .75rem; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
  .sync.ok::before { background: var(--pos); }
  .sync.pend::before { background: var(--neg); }
  main { max-width: 560px; margin: 0 auto; padding: 4px 14px calc(110px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio);
    box-shadow: var(--sombra); padding: 14px 16px; margin-bottom: 12px; }
  h2 { font-size: 1rem; margin: 18px 4px 8px; color: var(--sub); font-weight: 600; }
  .vazio { text-align: center; color: var(--sub); padding: 28px 10px; }
  .destaque { background: var(--pri-claro); border-color: transparent; }
  .destaque .grande { font-size: 1.6rem; font-weight: 700; }
  .linha-flex { display: flex; align-items: center; gap: 10px; }
  .linha-flex .cresce { flex: 1; min-width: 0; }
  .valor { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .sub { color: var(--sub); font-size: .85rem; }
  .divida { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--borda); }
  .divida:first-child { border-top: 0; padding-top: 2px; }
  .divida.minha { font-weight: 600; }
  .seta { color: var(--sub); }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--pri); color: #fff; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .btn { color: #062a26; } }
  .btn.sec { background: transparent; color: var(--pri); border: 1px solid var(--borda); }
  .btn.peq { padding: 6px 10px; font-size: .85rem; }
  .btn.perigo { background: transparent; color: var(--perigo); border: 1px solid var(--borda); }
  .btn:disabled { opacity: .5; }
  .grade3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pessoa { text-align: center; padding: 12px 8px; }
  .pessoa .nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pessoa .valor { font-size: 1.05rem; margin-top: 4px; }
  .item-li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--borda); cursor: pointer; }
  .item-li:first-child { border-top: 0; padding-top: 2px; }
  .item-li .tit { font-weight: 600; }
  .tag { display: inline-block; font-size: .72rem; background: var(--pri-claro); color: var(--pri);
    border-radius: 999px; padding: 1px 8px; margin-left: 4px; vertical-align: 1px; font-weight: 600; }
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; }
  .chip { border: 1px solid var(--borda); background: var(--card); border-radius: 999px; padding: 6px 14px; white-space: nowrap; cursor: pointer; }
  .chip.ativo { background: var(--pri); border-color: var(--pri); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip.ativo { color: #062a26; } }
  .switch { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--sub); margin: 6px 4px 0; }
  .switch input { width: 20px; height: 20px; accent-color: var(--pri); }

  .abas { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: flex; background: var(--card);
    border-top: 1px solid var(--borda); padding-bottom: env(safe-area-inset-bottom); }
  .abas button { flex: 1; border: 0; background: none; padding: 9px 0 10px; font-size: .75rem; color: var(--sub);
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .abas button svg { width: 24px; height: 24px; }
  .abas button.ativa { color: var(--pri); font-weight: 600; }
  .fab { position: fixed; right: 18px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 11;
    width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--pri); color: #fff;
    font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(15,118,110,.35); cursor: pointer; }
  @media (prefers-color-scheme: dark) { .fab { color: #062a26; } }
  @media (min-width: 600px) { .fab { right: calc(50% - 270px); } }

  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .modal[hidden] { display: none; }
  .folha { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); animation: sobe .18s ease-out; }
  @keyframes sobe { from { transform: translateY(30px); opacity: .5; } }
  .folha h3 { margin: 0 0 14px; font-size: 1.2rem; }
  label.campo { display: block; margin-bottom: 12px; font-size: .85rem; color: var(--sub); }
  label.campo input, label.campo select { display: block; width: 100%; margin-top: 4px; padding: 11px 12px;
    border: 1px solid var(--borda); border-radius: 10px; background: var(--card); font-size: 1rem; }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  fieldset { border: 0; padding: 0; margin: 0 0 12px; }
  legend { font-size: .85rem; color: var(--sub); margin-bottom: 6px; padding: 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { display: block; text-align: center; padding: 10px 6px; border: 1px solid var(--borda); border-radius: 10px;
    background: var(--card); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg input:checked + label { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .seg input:checked + label { color: #062a26; } }
  .seg input:focus-visible + label { outline: 2px solid var(--pri); outline-offset: 2px; }
  .previa { background: var(--card); border: 1px dashed var(--borda); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin-bottom: 12px; }
  .previa div + div { margin-top: 2px; }
  .acoes { display: flex; gap: 8px; margin-top: 8px; }
  .acoes .cresce { flex: 1; }
  .erro { color: var(--perigo); font-size: .85rem; min-height: 1em; margin: -4px 0 8px; }
  #toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #1f2937; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
  #toast.on { opacity: 1; }
  .rodape { text-align: center; color: var(--sub); font-size: .8rem; margin-top: 18px; }
  .rodape a { color: var(--pri); }
</style>
</head>
<body>
  <header class="topo">
    <h1>Gastos da Casa</h1>
    <span id="sync" class="sync"></span>
  </header>

  <main id="tela"><div class="vazio">Carregando…</div></main>

  <button id="fab" class="fab" aria-label="Adicionar" hidden>+</button>

  <nav class="abas" id="abas">
    <button data-aba="resumo" class="ativa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Resumo</button>
    <button data-aba="itens">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Itens</button>
    <button data-aba="pagamentos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 7h18"/><path d="M7 21l-4-4 4-4"/><path d="M21 17H3"/></svg>Acertos</button>
    <button data-aba="ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
  </nav>

  <div id="modal" class="modal" hidden><div class="folha" id="folha" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
